version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: monthly
    ignore:
      # Types follow the Node runtime (24 LTS, pinned in CI); move them together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
