name: CI

on:
  push:
    branches: [main, "Qiao527/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Engine — install
        working-directory: engine
        run: npm ci
      - name: Engine — typecheck and tests
        working-directory: engine
        run: npm run check
      - name: Rules — draft check (schema, references, every quote found in its source snapshot)
        working-directory: engine
        run: npm run rules:check-drafts
      - name: Standard scenarios
        working-directory: engine
        run: npm run scenarios

      - name: Data scripts — tests
        run: |
          python -m pip install --quiet pytest==9.0.3
          python -m pytest -q analysis tools

      - name: Web — install, typecheck, build (approved rules only)
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run typecheck
