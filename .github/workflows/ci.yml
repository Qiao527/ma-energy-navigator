name: CI

on:
  push:
    branches: [main, "Qiao527/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Engine — install
        working-directory: engine
        run: npm ci
      - name: Engine — typecheck and tests
        working-directory: engine
        run: npm run check
      - name: Rules — draft check (schema, references, every quote found in its source snapshot)
        working-directory: engine
        run: npm run rules:check-drafts
      - name: Standard scenarios
        working-directory: engine
        run: npm run scenarios

      - name: Data scripts — tests
        run: |
          python -m pip install --quiet pytest==9.0.3
          python -m pytest -q analysis tools

      - name: Web — install, typecheck, build (approved rules only)
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run typecheck
